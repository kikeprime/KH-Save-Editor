<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>KH Save Editor</title>
        <link rel="stylesheet" type="text/css" href="/static/style.css">
    </head>
    <body>
        <div style="margin-bottom: 10px">
            <div>
                <h1 style="color: #0088CE; font-size: 30px">
                    Kingdom Hearts Save Editor    <img src="assets/favicon.ico" height="30">
                </h1>
            </div>
            <div>
                <h2 for="game">Select Game:</h2>
                <select name="game" id="game">
                    <optgroup label="Kingdom Hearts 1">
                        <option value="kh1">Vanilla KH1</option>
                        <option value="kh1fm">KH1FM</option>
                    </optgroup>
                    <optgroup label="Kingdom Hearts 2">
                        <option value="kh2jp">Vanilla KH2</option>
                        <option value="kh2us">Vanilla USA KH2</option>
                        <option value="kh2fm">KH2FM</option>
                    </optgroup>
                    <optgroup label="Kingdom Hearts Birth by Sleep">
                        <option value="khbbsjp">Vanilla BBS</option>
                        <option value="khbbsus">Vanilla USA BBS</option>
                        <option value="khbbsfm">KHBBSFM</option>
                    </optgroup>
                    <optgroup label="Kingdom Hearts 3">
                        <option value="kh3rmpc">KH3RM PC</option>
                    </optgroup>
                </select>
            </div>
            <div>
                <h2 for="mainsavefile">Select Main Save File:</h2>
                <input type="file" id="mainsavefile">
            </div>
        </div>
        <div id="app"></div>
        <script type="module">
            import KH1 from "/kh1_src/kh1.js";
            let kh1 = 0
            const input = document.getElementById("mainsavefile");
            input.addEventListener("change", () => {
                const app = document.getElementById("app");
                const data = input.files[0]
                kh1 = new KH1(data, false);
                app.innerHTML = kh1.str()
            });
        </script>
    </body>
</html>
