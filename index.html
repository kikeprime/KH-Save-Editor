<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>KH Save Editor Online</title>
        <link rel="stylesheet" type="text/css" href="static/style.css">
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    </head>
    <body>
        <div style="margin-bottom: 10px">
            <div style="display: flex; align-items: center; gap: 40px">
                <div>
                    <h1 style="font-size: 30px">
                        Kingdom Hearts Save Editor    <img src="assets/favicon.ico" height="30">
                    </h1>
                </div>
                <details>
                    <summary>
                        Series Selector
                    </summary>
                    <a href="https://kikeprime.github.io/KH-Save-Editor" style="display: block">
                        <img src="assets/favicon.ico" height="32">
                    </a>
                    <a href="https://kikeprime.github.io/Orbal-Save-Editor" style="display: block">
                        <img src="assets/Estelle (Sora FC Orbment).png" height="32">
                    </a>
                </details>
            </div>
            <div>
                <h2 for="game">Select Game:</h2>
                <select id="game">
                    <optgroup label="Kingdom Hearts 1">
                        <option value="kh1">Vanilla KH1</option>
                        <option value="kh1fm">KH1FM</option>
                    </optgroup>
                    <optgroup label="Kingdom Hearts 2">
                        <option value="kh2jp">Vanilla JP KH2</option>
                        <option value="kh2us">Vanilla USA KH2</option>
                        <option value="kh2fm">KH2FM</option>
                    </optgroup>
                    <optgroup label="Kingdom Hearts Birth by Sleep">
                        <option value="khbbsjp">Vanilla JP BBS</option>
                        <option value="khbbsus">Vanilla USA BBS</option>
                        <option value="khbbsfm">KHBBSFM</option>
                    </optgroup>
                    <optgroup label="Kingdom Hearts 0.2 Birth by Sleep">
                        <option value="kh02">KH0.2 Raw</option>
                        <option value="kh02pc">KH0.2 PNG</option>
                    </optgroup>
                    <optgroup label="Kingdom Hearts 3">
                        <option value="kh3rmpc">KH3RM PC</option>
                    </optgroup>
                </select>
                <label style="display: flex; align-items: center; gap: 10px; margin-top: 20px">
                    Account ID:
                    <input
                        id="account"
                        type="text"
                        value="1638"
                    >
                </label>
            </div>
            <div style="display: flex">
                <div>
                    <h2>Select Main Save File:</h2>
                    <input type="file" id="mainsavefile">
                </div>
                <div>
                    <h2>Select System Save File:</h2>
                    <h3 style="color: red">LOAD IT AFTER THE MAIN SAVE!!!</h3>
                    <input type="file" id="systemsavefile">
                </div>
            </div>
            <div style="display: flex; gap: 20px">
                <a href="./remix_png.html"><button>Open KH Remix PNG Editor</button></a>
                <a href="https://github.com/kikeprime/KH-Save-Editor"><button>Source Code</button></a>
            </div>
            <div>
                <h2>Download Edited Save File(s):</h2>
                <button id="save" style="width: 100px">Save</button>
            </div>
        </div>
        <div id="app"></div>
        <script type="module">
            import KH1 from "./kh1_src/kh1.js";
            import KH2 from "./kh2_src/kh2.js";
            import KH02 from "./kh02_src/kh02.js";
            import KH3 from "./kh3_src/kh3.js";
            const app = document.getElementById("app");
            const game = document.getElementById("game");
            const account = document.getElementById("account");
            const mainsavefile = document.getElementById("mainsavefile");
            mainsavefile.addEventListener("change", async () => {
                const file = mainsavefile.files[0];
                switch (game.value) {
                    case "kh1": {
                        window.kh1 = new KH1(file, false);
                        window.kh2 = null;
                        window.kh3 = null;
                        window.khbbs = null;
                        window.kh02 = null;
                        await window.kh1.loaded;
                        console.log(String(kh1));
                        kh1.menu();
                        break;
                    }
                    case "kh1fm": {
                        window.kh1 = new KH1(file, true);
                        window.kh2 = null;
                        window.kh3 = null;
                        window.khbbs = null;
                        window.kh02 = null;
                        await window.kh1.loaded;
                        console.log(String(kh1));
                        kh1.menu();
                        break;
                    }
                    case "kh2jp": {
                        window.kh1 = null;
                        window.kh2 = new KH2(file, 0);
                        window.kh3 = null;
                        window.khbbs = null;
                        window.kh02 = null;
                        await window.kh2.loaded;
                        console.log(String(kh2));
                        kh2.menu();
                        break;
                    }
                    case "kh2us": {
                        window.kh1 = null;
                        window.kh2 = new KH2(file, 1);
                        window.kh3 = null;
                        window.khbbs = null;
                        window.kh02 = null;
                        await window.kh2.loaded;
                        console.log(String(kh2));
                        kh2.menu();
                        break;
                    }
                    case "kh2fm": {
                        window.kh1 = null;
                        window.kh2 = new KH2(file, 2);
                        window.kh3 = null;
                        window.khbbs = null;
                        window.kh02 = null;
                        await window.kh2.loaded;
                        console.log(String(kh2));
                        kh2.menu();
                        break;
                    }
                    case "kh3rmpc": {
                        window.kh1 = null;
                        window.kh2 = null;
                        window.kh3 = new KH3(file, 3, account.value);
                        window.khbbs = null;
                        window.kh02 = null;
                        await window.kh3.loaded;
                        console.log(String(kh3));
                        kh3.menu();
                        break;
                    }
                    case "kh02": {
                        window.kh1 = null;
                        window.kh2 = null;
                        window.kh3 = null;
                        window.khbbs = null;
                        window.kh02 = new KH02(file, false, account.value);
                        await window.kh02.loaded;
                        console.log(String(kh02));
                        kh02.menu();
                        break;
                    }
                    case "kh02pc": {
                        window.kh1 = null;
                        window.kh2 = null;
                        window.kh3 = null;
                        window.khbbs = null;
                        window.kh02 = new KH02(file, true, account.value);
                        await window.kh02.loaded;
                        console.log(String(kh02));
                        kh02.menu();
                        break;
                    }
                    default:
                        break;
                }
            });
            systemsavefile.addEventListener("change", async () => {
                const file = systemsavefile.files[0];
                switch (game.value) {
                    case "kh1":
                    case "kh1fm": {
                        await kh1.load_sys(file);
                        kh1.menu();
                    }
                    default:
                        break;
                }
            });
            const save = document.getElementById("save");
            save.addEventListener("click", async () => {
                switch (game.value) {
                    case "kh1":
                    case "kh1fm": {
                        try {
                            const picker = await window.showSaveFilePicker({suggestedName: kh1.file.name});
                            const writable = await picker.createWritable();
                            await writable.write(kh1.save());
                            await writable.close();
                        } catch (e) {
                            if (e.name == "AbortError") return;
                            return e;
                        }
                        if (kh1.sysfile != null) {
                            try {
                                const picker = await window.showSaveFilePicker({suggestedName: kh1.sysfile.name});
                                const writable = await picker.createWritable();
                                await writable.write(kh1.syssave());
                                await writable.close();
                            } catch (e) {
                                if (e.name == "AbortError") return;
                                return e;
                            }
                        }
                        break;
                    }
                    case "kh2jp":
                    case "kh2us":
                    case "kh2fm": {
                        try {
                            const picker = await window.showSaveFilePicker({suggestedName: kh2.file.name});
                            const writable = await picker.createWritable();
                            await writable.write(kh2.save());
                            await writable.close();
                        } catch (e) {
                            if (e.name == "AbortError") return;
                            return e;
                        }
                        break;
                    }
                    case "kh3rmpc": {
                        try {
                            const picker = await window.showSaveFilePicker({suggestedName: kh3.file.name});
                            const writable = await picker.createWritable();
                            await writable.write(kh3.save(true));
                            await writable.close();
                        } catch (e) {
                            if (e.name == "AbortError") return;
                            return e;
                        }
                        try {
                            const picker = await window.showSaveFilePicker({suggestedName: kh3.file.name+".decrypted"});
                            const writable = await picker.createWritable();
                            await writable.write(kh3.save(false));
                            await writable.close();
                        } catch (e) {
                            if (e.name == "AbortError") return;
                            return e;
                        }
                        break;
                    }
                    case "kh02":
                    case "kh02pc": {
                        try {
                            const picker = await window.showSaveFilePicker({suggestedName: kh02.file.name});
                            const writable = await picker.createWritable();
                            await writable.write(kh02.save(true));
                            await writable.close();
                        } catch (e) {
                            if (e.name == "AbortError") return;
                            return e;
                        }
                        if (kh02.pc) {
                            try {
                                const picker = await window.showSaveFilePicker({suggestedName: kh02.file.name+".decrypted"});
                                const writable = await picker.createWritable();
                                await writable.write(kh02.save(false));
                                await writable.close();
                            } catch (e) {
                                if (e.name == "AbortError") return;
                                return e;
                            }
                        }
                        break;
                    }
                }
            });
        </script>
        <script src="https://cdn.jsdelivr.net/npm/eruda@3.4.2"></script>
        <script>
            eruda.init({
                defaults: {
                    displaySize: 70,
                }
            });
            eruda.position({x: 445, y: 64});
        </script>
        <script src="https://cdn.sheetjs.com/crc-32-latest/package/crc32.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
        <script src="https://cdn.jsdelivr.net/npm/aes-js@3.1.2"></script>
    </body>
</html>
