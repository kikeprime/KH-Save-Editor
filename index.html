<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>KH Save Editor</title>
        <link rel="stylesheet" type="text/css" href="static/style.css">
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    </head>
    <body>
        <div style="margin-bottom: 10px">
            <div>
                <h1 style="color: #0088CE; font-size: 30px">
                    Kingdom Hearts Save Editor    <img src="assets/favicon.ico" height="30">
                </h1>
            </div>
            <div>
                <h2 for="game">Select Game:</h2>
                <select id="game">
                    <optgroup label="Kingdom Hearts 1">
                        <option value="kh1">Vanilla KH1</option>
                        <option value="kh1fm">KH1FM</option>
                    </optgroup>
                    <optgroup label="Kingdom Hearts 2">
                        <option value="kh2jp">Vanilla JP KH2</option>
                        <option value="kh2us">Vanilla USA KH2</option>
                        <option value="kh2fm">KH2FM</option>
                    </optgroup>
                    <optgroup label="Kingdom Hearts Birth by Sleep">
                        <option value="khbbsjp">Vanilla JP BBS</option>
                        <option value="khbbsus">Vanilla USA BBS</option>
                        <option value="khbbsfm">KHBBSFM</option>
                    </optgroup>
                    <optgroup label="Kingdom Hearts 3">
                        <option value="kh3rmpc">KH3RM PC</option>
                    </optgroup>
                </select>
            </div>
            <div>
                <h2>Select Main Save File:</h2>
                <input type="file" id="mainsavefile">
            </div>
            <div>
                <h2>Select System Save File:</h2>
                <h3 style="color: red">LOAD IT AFTER THE MAIN SAVE!!!</h3>
                <input type="file" id="systemsavefile">
            </div>
            <div>
                <h2>Download Edited Save File(s):</h2>
                <button id="save" style="width: 100px">Save</button>
            </div>
        </div>
        <div id="app"></div>
        <script type="module">
            import KH1 from "./kh1_src/kh1.js";
            const app = document.getElementById("app");
            const game = document.getElementById("game");
            const mainsavefile = document.getElementById("mainsavefile");
            mainsavefile.addEventListener("change", async () => {
                const file = mainsavefile.files[0];
                switch (game.value) {
                    case "kh1": {
                        window.kh1 = new KH1(file, false);
                        window.kh2 = null;
                        window.kh3 = null;
                        window.khbbs = null;
                        await window.kh1.loaded;
                        console.log(String(kh1));
                        kh1.menu();
                        break;
                    }
                    case "kh1fm": {
                        window.kh1 = new KH1(file, true);
                        window.kh2 = null;
                        window.kh3 = null;
                        window.khbbs = null;
                        await window.kh1.loaded;
                        console.log(String(kh1));
                        kh1.menu();
                        break;
                    }
                    default:
                        break;
                }
            });
            systemsavefile.addEventListener("change", async () => {
                const file = systemsavefile.files[0];
                switch (game.value) {
                    case "kh1":
                    case "kh1fm": {
                        await kh1.load_sys(file);
                        kh1.menu();
                    }
                    default:
                        break;
                }
            });
            const save = document.getElementById("save");
            save.addEventListener("click", async () => {
                switch (game.value) {
                    case "kh1":
                    case "kh1fm": {
                        try {
                            const picker = await window.showSaveFilePicker({suggestedName: kh1.file.name});
                            const writable = await picker.createWritable();
                            await writable.write(kh1.save());
                            await writable.close();
                            return;
                        } catch (e) {
                            if (e.name == "AbortError") return;
                            return e;
                        }
                        if (kh1.sysfile != null) {
                            try {
                                const picker = await window.showSaveFilePicker({suggestedName: kh1.sysfile.name});
                                const writable = await picker.createWritable();
                                await writable.write(kh1.syssave());
                                await writable.close();
                                return;
                            } catch (e) {
                                if (e.name == "AbortError") return;
                                return e;
                            }
                        }
                    }
                }
            });
        </script>
        <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
        <script>
            eruda.init({
                defaults: {
                    displaySize: 70,
                }
            });
            eruda.position({x: 500, y: 20});
        </script>
    </body>
</html>
